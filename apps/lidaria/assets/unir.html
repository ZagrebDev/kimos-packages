<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unirse a una sesión de LiDARia</title>
<style>
  :root { color-scheme: light dark; --fg: #0f172a; --mut: #64748b; --bg: #f8fafc; --card: #fff; --line: #e2e8f0; --pri: #0ea5e9; --mal: #dc2626; --bien: #16a34a; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e2e8f0; --mut: #94a3b8; --bg: #0b1220; --card: #111c2e; --line: #1e293b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 480px; margin: 0 auto; }
  .tarjeta { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 18px 0 6px; }
  p { margin: 8px 0; }
  .mini { font-size: 13px; color: var(--mut); }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .kv:last-child { border-bottom: 0; }
  .kv b { text-align: right; }
  button { width: 100%; padding: 14px; font: inherit; font-weight: 600; border: 0; border-radius: 11px; background: var(--pri); color: #fff; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: not-allowed; }
  button.sec { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 400; margin-top: 8px; }
  .aviso { border-left: 3px solid var(--mal); padding-left: 10px; font-size: 14px; }
  .ok { border-left-color: var(--bien); }
  ul { padding-left: 20px; margin: 8px 0; }
  li { font-size: 14px; margin: 4px 0; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; }
  .cargando { text-align: center; color: var(--mut); padding: 30px 0; }
</style>
</head>
<body>
<main id="app"><div class="cargando">Leyendo el código…</div></main>
<script src="./unir.js"></script>
</body>
</html>
