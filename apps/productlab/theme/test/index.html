<!--
  Harness LOCAL del kit de theme ProductLab (sin red externa: imágenes SVG en
  data-URLs y visor 3D con about:blank).

  Cómo correrlo:
    cd /home/user/kimos-packages/apps/productlab/theme
    python3 -m http.server 8000
    → abrir http://localhost:8000/test/index.html

  Qué ejercita (contra test/productlab.json, JSON version 2, clave `productos`):
    · Paso condicional "Color del soporte": aparece solo con
      Accesorio = "Pack 2 soportes" (dependsOn); al volver a "Sin accesorio"
      desaparece y su select nativo vuelve al default (aviso en el panel).
    · Valor con qty (Pack 2 soportes ×2) y valor neutral ("Sin accesorio").
    · Dos secciones kind:'imagen' (300px y 600px de alto natural; una 'full',
      otra 'content' con link).
    · Sección kind:'visor3d' (iframe about:blank, alto 420). El link AR se
      omite porque la URL del JSON no termina en /definition (en producción
      la URL del gateway sí).
    · storefront.style: accentColor #7C3AED, bgColor, radius 12,
      cardStyle 'list' (cambia showDeltas/cardStyle/stepsCollapsed en
      productlab.json para probar las otras variantes).
    · Hero del builder con height:'auto' y foto size:'auto'.
  Nota: data-kimos-url debe ser URL absoluta (el saneador fuerza https:// en
  URLs sin protocolo).
-->
